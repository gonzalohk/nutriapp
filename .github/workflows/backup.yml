name: Weekly database backup

# Free Supabase projects have no automatic backups and pause after a week of inactivity.
# This job dumps the database every week (which also counts as activity, so the project stays awake).
# IMPORTANT: the dump contains personal data. Run this only in a PRIVATE repository.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Dump schema and data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: ./scripts/backup.sh backups
      - uses: actions/upload-artifact@v4
        with:
          name: nutrilara-backup
          path: backups/
          retention-days: 90
